name: PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/pesayetu/**"
      - "apps/roboshield/**"
      - "apps/techlabblog/**"
      - "apps/trustlab/**"
      - "docker/apps/pesayetu/**"
      - "docker/apps/roboshield/**"
      - "docker/apps/techlabblog/**"
      - "docker/apps/trustlab/**"
      - "docker-bake.hcl"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "packages/**"
      - "scripts/revalidate.mjs"
      - "scripts/pr-build-targets.mjs"
      - "scripts/pr-build-targets.test.mjs"
      - ".github/workflows/_bake-and-push.yml"
      - ".github/workflows/_build-pesayetu.yml"
      - ".github/workflows/_build-roboshield.yml"
      - ".github/workflows/_build-techlabblog.yml"
      - ".github/workflows/_build-trustlab.yml"
      - ".github/workflows/pesayetu.yml"
      - ".github/workflows/pr-build.yml"
      - ".github/workflows/roboshield.yml"
      - ".github/workflows/techlabblog.yml"
      - ".github/workflows/trustlab.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label }}"
  cancel-in-progress: true

jobs:
  affected:
    name: Detect affected apps
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Check PR trust boundary
        id: trust
        shell: bash
        run: |
          trusted=false
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            case "${{ github.event.pull_request.author_association }}" in
              OWNER|MEMBER|COLLABORATOR)
                trusted=true
                ;;
            esac
          fi
          echo "trusted=${trusted}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: ${{ steps.trust.outputs.trusted == 'true' }}
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pnpm
        if: ${{ steps.trust.outputs.trusted == 'true' }}
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        if: ${{ steps.trust.outputs.trusted == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        if: ${{ steps.trust.outputs.trusted == 'true' }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Detect app build targets
        id: targets
        shell: bash
        run: |
          if [[ "${{ steps.trust.outputs.trusted }}" != "true" ]]; then
            echo "App PR builds are skipped for fork or untrusted PRs."
            echo "targets=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node scripts/pr-build-targets.mjs \
            --github-output \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  build-pesayetu:
    name: Build pesayetu image
    needs: affected
    if: ${{ contains(fromJSON(needs.affected.outputs.targets), 'pesayetu') }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_build-pesayetu.yml
    with:
      base_tag: ${{ vars.UI_BASE_TAG }}
      tag: pr-${{ github.event.pull_request.number }}-${{ github.sha }}
      push: false
      app_url: ${{ vars.PESAYETU_APP_URL }}
    secrets:
      WORDPRESS_URL: ${{ secrets.PESAYETU_WORDPRESS_URL }}
      WORDPRESS_MULTISITE_PREFIX: ${{ secrets.PESAYETU_WORDPRESS_MULTISITE_PREFIX }}
      HURUMAP_API_URL: ${{ secrets.PESAYETU_HURUMAP_API_URL }}
      # Preview/authentication paths are not exercised during static generation.
      # Keep their build-secret mounts populated without exposing production credentials
      # to code from a pull request.
      JWT_SECRET_KEY: pr-build-unused
      WORDPRESS_APPLICATION_USERNAME: pr-build-unused
      WORDPRESS_APPLICATION_PASSWORD: pr-build-unused
      WORDPRESS_PREVIEW_SECRET: pr-build-unused

  build-roboshield:
    name: Build roboshield image
    needs: affected
    if: ${{ contains(fromJSON(needs.affected.outputs.targets), 'roboshield') }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_build-roboshield.yml
    with:
      base_tag: ${{ vars.UI_BASE_TAG }}
      tag: pr-${{ github.event.pull_request.number }}-${{ github.sha }}
      push: false
      app_url: "http://localhost:3000"
      sentry_environment: ci
    secrets:
      # Payload's mongooseAdapter is not queried during static generation, so
      # PR builds don't need a reachable database — a well-formed but unused
      # connection string is enough to satisfy the build. The remaining
      # secrets are not required to compile either.
      DATABASE_URL: "mongodb://pr-build-unused/pr-build-unused"
      PAYLOAD_SECRET: pr-build-unused
      NEXT_PUBLIC_SENTRY_DSN: pr-build-unused
      SENTRY_AUTH_TOKEN: pr-build-unused
      SENTRY_ORG: pr-build-unused
      SENTRY_PROJECT: pr-build-unused

  build-techlabblog:
    name: Build techlabblog image
    needs: affected
    if: ${{ contains(fromJSON(needs.affected.outputs.targets), 'techlabblog') }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_build-techlabblog.yml
    with:
      base_tag: ${{ vars.UI_BASE_TAG }}
      tag: pr-${{ github.event.pull_request.number }}-${{ github.sha }}
      push: false
      sentry_environment: ci
    secrets:
      # TechLab Blog has no active Sentry build integration. Preserve the
      # reusable workflow's secret-mount contract without exposing credentials.
      SENTRY_AUTH_TOKEN: pr-build-unused
      SENTRY_ORG: pr-build-unused
      SENTRY_PROJECT: pr-build-unused

  build-trustlab:
    name: Build trustlab image
    needs: affected
    if: ${{ contains(fromJSON(needs.affected.outputs.targets), 'trustlab') }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_build-trustlab.yml
    with:
      base_tag: ${{ vars.UI_BASE_TAG }}
      tag: pr-${{ github.event.pull_request.number }}-${{ github.sha }}
      push: false
    secrets:
      # Payload connects while generating the sitemap, so PR builds need a
      # reachable database. The remaining secrets are not required to compile.
      DATABASE_URL: ${{ secrets.TRUSTLAB_MONGO_URL }}
      PAYLOAD_SECRET: pr-build-unused
      SENTRY_AUTH_TOKEN: pr-build-unused
      SENTRY_ORG: pr-build-unused
      SENTRY_PROJECT: pr-build-unused
