name: Reusable Build | RoboShield

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: "Image tag to build or push"
      push:
        required: true
        type: boolean
        description: "Whether to push the built image to the registry"
      base_tag:
        required: true
        type: string
        description: "Published base image tag to build from"
      app_url:
        required: true
        type: string
        description: "NEXT_PUBLIC_APP_URL baked into the client bundle (public, not a secret)"
      sentry_environment:
        required: true
        type: string
        description: "Sentry environment baked into the app"
      set:
        required: false
        type: string
        default: ""
        description: "Additional bake --set overrides"
    secrets:
      DOCKER_HUB_USERNAME:
        required: false
      DOCKER_HUB_ACCESS_TOKEN:
        required: false
      MONGO_URL:
        required: false
      PAYLOAD_SECRET:
        required: false
      # Not a genuine secret (Sentry DSNs are inlined into the public client
      # bundle by design) but plumbed as one because it's stored as a GitHub
      # Secret today; going through --mount=type=secret keeps it unlogged
      # without needing a GitHub Variable migration.
      NEXT_PUBLIC_SENTRY_DSN:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_ORG:
        required: false
      SENTRY_PROJECT:
        required: false

jobs:
  build:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_bake-and-push.yml
    with:
      target: roboshield
      target_os: '["ubuntu-24.04-arm"]'
      base_tag: ${{ inputs.base_tag }}
      tag: ${{ inputs.tag }}
      push: ${{ inputs.push }}
      set: |
        roboshield.args.NEXT_PUBLIC_APP_URL=${{ inputs.app_url }}
        roboshield.args.SENTRY_ENVIRONMENT=${{ inputs.sentry_environment }}
        ${{ inputs.set }}
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      MONGO_URL: ${{ secrets.MONGO_URL }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
