name: Climate Mapped Africa

on:
  push:
    branches:
      - main
    paths:
      - "apps/climatemappedafrica/**"
      - "docker/apps/climatemappedafrica/**"
      - "docker-bake.hcl"
      - ".github/workflows/_bake-and-push.yml"
      - ".github/workflows/_build-climatemappedafrica.yml"
      - ".github/workflows/climatemappedafrica.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Checks whether apps/climatemappedafrica/package.json has a version bump.
  # Every push builds and deploys DEV; only a version bump builds and deploys
  # PROD.
  version-check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"

      - name: Check if version is bumped
        id: check
        uses: EndBug/version-check@095362f3cd50f690c8fa0e6afeea81834bd8d320 # v3.0.0
        with:
          diff-search: true
          file-name: apps/climatemappedafrica/package.json

  # Required GitHub Secrets:
  #   CLIMATEMAPPEDAFRICA_DEV_DATABASE_URL, CLIMATEMAPPEDAFRICA_PRD_DATABASE_URL,
  #   CLIMATEMAPPEDAFRICA_PAYLOAD_SECRET, UI_BASE_TAG (var)
  build-dev:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_build-climatemappedafrica.yml
    with:
      base_tag: ${{ vars.UI_BASE_TAG }}
      tag: ${{ github.sha }}
      push: true
      app_url: "https://climatemapped-africa.dev.codeforafrica.org"
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      DATABASE_URL: ${{ secrets.CLIMATEMAPPEDAFRICA_DEV_DATABASE_URL }}
      PAYLOAD_SECRET: ${{ secrets.CLIMATEMAPPEDAFRICA_PAYLOAD_SECRET }}

  deploy-dev:
    needs: build-dev
    permissions: {}
    uses: ./.github/workflows/push-to-dokku.yml
    with:
      git_remote_url: "ssh://azureuser@ui-1.dev.codeforafrica.org/climatemapped-africa-ui"
      deploy_docker_image: "codeforafrica/climatemappedafrica:${{ github.sha }}"
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  build-prod:
    needs: version-check
    if: needs.version-check.outputs.changed == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_build-climatemappedafrica.yml
    with:
      base_tag: ${{ vars.UI_BASE_TAG }}
      tag: ${{ needs.version-check.outputs.version }}
      push: true
      app_url: "https://climatemapped-africa.prod.codeforafrica.org"
      set: |
        climatemappedafrica.tags+=codeforafrica/climatemappedafrica:latest
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      DATABASE_URL: ${{ secrets.CLIMATEMAPPEDAFRICA_PRD_DATABASE_URL }}
      PAYLOAD_SECRET: ${{ secrets.CLIMATEMAPPEDAFRICA_PAYLOAD_SECRET }}

  deploy-prod:
    needs: [version-check, build-prod]
    if: needs.version-check.outputs.changed == 'true'
    permissions: {}
    uses: ./.github/workflows/push-to-dokku.yml
    with:
      git_remote_url: "ssh://dokku@ui-2.prod.codeforafrica.org/climatemapped-africa-ui"
      deploy_docker_image: "codeforafrica/climatemappedafrica:${{ needs.version-check.outputs.version }}"
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
