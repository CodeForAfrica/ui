name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      MONGO_URL: ${{ secrets.MONGO_URL }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    strategy:
      matrix:
        os: [ubuntu-26.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # pnpm/action-setup must come first: setup-node's `cache: "pnpm"` shells
      # out to `pnpm store path`, so pnpm has to exist by then.
      # https://github.com/actions/setup-node/blob/main/docs/advanced-usage.md#caching-packages-data
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      # `cache: "pnpm"` below replaces the manual `pnpm store path` +
      # actions/cache pair this job used to carry. That pair was not just
      # redundant: it ran `pnpm store path` on the runner's default Node,
      # i.e. before Node 24 was installed. No repository script may run
      # before this step.
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Confirm pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install

      # root task
      # https://turborepo.dev/docs/guides/tools/oxc#create-root-tasks-1
      - name: Format
        run: pnpm exec turbo format:check

      - name: Lint
        run: pnpm lint:check

      # Standard linux runners for public repositories have 4 vCPUs and 16GB of RAM
      # see: https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
      - name: Test
        run: pnpm test:ci

      # Shared packages are developed against React 18 but also compiled into
      # React 19 apps, so run their tests on React 19 too.
      - name: Test shared packages on React 19
        run: pnpm jest:react-19

      # Compile opted-in apps without prerendering pages. This keeps module
      # resolution and bundler compilation deterministic when full builds read
      # from live services. Compile two at a time: all the Next.js 16 apps at
      # once can exhaust the runner's 16 GB of memory.
      - name: Compile apps
        run: pnpm build:compile --concurrency=2
        env:
          CHECK_BUNDLE_SINGLETONS: "1"

      # Shared packages are compiled from source; make sure each app still
      # bundles one copy of React, Next, MUI and Emotion.
      - name: Check bundled singletons
        run: pnpm check:bundle-singletons

      # TODO: Re-enable build in a dedicated CI build cleanup PR. The current
      # build surface needs app-scoped env isolation for Payload/Next apps.
      - name: Build
        if: ${{ false }}
        run: pnpm build

      # TODO: Re-enable Playwright browser installation with the Playwright check below.
      - name: Install Playwright browsers
        if: ${{ false }}
        run: npx playwright install --with-deps

      # TODO: Re-enable Playwright in a dedicated E2E cleanup PR. The current
      # Playwright surface has stale app-level configs for apps with no specs.
      - name: Playwright
        if: ${{ false }}
        run: pnpm playwright
