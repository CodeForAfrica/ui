catalogs:
  # @mui/styles was deprecated with the release of MUI Core v5 in late 2021
  # @mui/styles is not compatible with React.StrictMode or React 18, and it will not be updated.
  # @see: https://mui.com/system/styles/basics/
  # pesayetu and twoopstracker still use @mui/styles
  mui-styles:
    "@mui/icons-material": ^5.16.6
    "@mui/lab": ^5.0.0-alpha.155
    "@mui/material": ^5.16.6
    "@mui/styles": ^5.16.6
    "@mui/utils": ^5.16.6
    "@mui/private-theming": ^5.16.6
  payload-v3:
    "@payloadcms/admin-bar": ^3.90.2
    "@payloadcms/db-mongodb": ^3.90.2
    "@payloadcms/email-nodemailer": ^3.90.2
    "@payloadcms/live-preview-react": ^3.90.2
    "@payloadcms/next": ^3.90.2
    "@payloadcms/payload-cloud": ^3.90.2
    "@payloadcms/plugin-cloud-storage": ^3.90.2
    "@payloadcms/plugin-form-builder": ^3.90.2
    "@payloadcms/plugin-nested-docs": ^3.90.2
    "@payloadcms/plugin-redirects": ^3.90.2
    "@payloadcms/plugin-search": ^3.90.2
    "@payloadcms/plugin-sentry": ^3.90.2
    "@payloadcms/plugin-seo": ^3.90.2
    "@payloadcms/richtext-lexical": ^3.90.2
    "@payloadcms/storage-s3": ^3.90.2
    "@payloadcms/ui": ^3.90.2
    graphql: ^16.11.0
    payload: ^3.90.2
    require-in-the-middle: ^7.5.2
  # Next.js 16 and the integrations whose Next.js 15 releases don't support
  # it. Apps opt in, as with react-19 (App Router apps need both). Payload v3
  # needs Next.js >=16.3.3, and 16.4.0 is the minimum for apps with compound
  # pageExtensions such as trustlab's (vercel/next.js#93246). Kept to patch
  # releases until Payload's release notes cover a newer minor. Keep
  # next and @next/* on the same version: Dependabot ignores @next/env 16.x,
  # because the default catalog's @next/env 15 belongs to the Payload v2 apps.
  next-16:
    "@mui/material-nextjs": ^7.3.10
    "@next/env": ~16.4.2
    "@next/mdx": ~16.4.2
    "@next/third-parties": ~16.4.2
    "@sentry/nextjs": ^10.76.2
    next: ~16.4.2
  react-19:
    "@types/react": ^19.2.0
    "@types/react-dom": ^19.2.0
    "react": ^19.3.1
    react-ace: ^14.0.1
    "react-dom": ^19.3.1
  # Peer ranges for the shared packages: every major that some app uses.
  # Widen a range when an app moves to a new major, and narrow it when the
  # last app leaves one.
  shared-peers:
    next: ^15.5.0 || ^16.0.0
    react: ^18.3.0 || ^19.0.0
    react-dom: ^18.3.0 || ^19.0.0
# Dependency lifecycle scripts are opt-in. pnpm 11 replaced pnpm 10's
# `onlyBuiltDependencies` allowlist with this explicit true/false map and fails
# the install (ERR_PNPM_IGNORED_BUILDS) while any entry is undecided, so every
# package that ships a script has to be ruled on here.
#
# `true` is reserved for native modules that genuinely have to compile. The
# `false` entries below are the packages pnpm 10 was already skipping — they
# either only print a postinstall banner (core-js, es5-ext, aws-sdk) or resolve
# their platform binary through optionalDependencies rather than the script
# (esbuild, @swc/core, unrs-resolver, @parcel/watcher, @sentry/cli). Recording
# them as `false` preserves today's behaviour; it does not change it.
#
# Run `pnpm approve-builds` after adding a dependency that pnpm flags here.
allowBuilds:
  "@parcel/watcher": false
  "@sentry/cli": false
  "@swc/core": false
  aws-sdk: false
  better-sqlite3: true
  core-js: false
  core-js-pure: false
  es5-ext: false
  esbuild: false
  sharp: true
  sqlite3: true
  unrs-resolver: false
