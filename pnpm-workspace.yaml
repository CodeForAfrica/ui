# Workspaces
packages:
  - apps/*
  - packages/*

blockExoticSubdeps: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade

# The toolchain contract is declared once, in the root package.json:
#   engines.node    — the supported Node.js range
#   engines.pnpm    — the supported pnpm range
#   packageManager  — the exact pnpm build pnpm self-provisions
#
# engineStrict does two distinct things. Both are intended here:
#
#   1. It escalates the root engines.node check from a warning to a hard
#      failure. Without it pnpm only prints "[WARN] Unsupported engine" and
#      installs anyway, so a contributor on the wrong Node major gets a mystery
#      build error later instead of an actionable one now. This is what makes
#      engines.node enforcement rather than documentation, and it is why the
#      repo carries no .nvmrc/.node-version — there is nothing to keep in sync.
#
#   2. It also rejects any *dependency* whose own engines.node excludes the
#      running runtime (ERR_PNPM_UNSUPPORTED_ENGINE). That is a supply-chain
#      policy, not toolchain standardisation, and it is deliberate: it sits
#      alongside blockExoticSubdeps / minimumReleaseAge / trustPolicy above.
#      The trade-off is that a dependency publishing an overly narrow range can
#      block an install. No current dependency does.
#
#      If one ever does, there is no targeted override. Both plausible ones were
#      tested and neither works: packageExtensions only accepts dependencies /
#      optionalDependencies / peerDependencies / peerDependenciesMeta, so an
#      `engines` key there is silently ignored; and a .pnpmfile.cjs readPackage
#      hook loads but runs too late — the engine check has already failed. The
#      real options are to upgrade, replace or patch the dependency, or to drop
#      engineStrict for the whole workspace. Do not spend an afternoon
#      rediscovering the two dead ends.
engineStrict: true
# TODO(kilemensi): To upgrade these pages, code change is necessary
trustPolicyExclude:
  - "@mui/x-tree-view@7.29.10"

# Catalogs control direct dependencies; these overrides also align transitive
# consumers. Keep them here because pnpm 11+ ignores package.json#pnpm.overrides.
overrides:
  # Payload v2 and its webpack stack request older SWC releases.
  "@swc/core": "catalog:"
  # Keep eslint-plugin-import and Next's ESLint config on the flat-config resolver.
  eslint-import-resolver-typescript: "catalog:"
  # plugin-sentry depends on @sentry/nextjs 9, which doesn't support Next.js
  # 16. Its admin ErrorBoundary would also bundle a second, uninitialised SDK
  # instead of reporting through the app's Sentry 10 client.
  "@payloadcms/plugin-sentry>@sentry/nextjs": "catalog:next-16"
  # Payload v3 and NextAuth otherwise resolve different JOSE generations.
  jose: "catalog:"
  # Payload v2 otherwise brings in an older logger for the current Node runtime.
  pino: "catalog:"
  # These packages declare Babel runtime 7.0 but import the newer createSuper helper.
  "react-swipeable-views-react-18-fix@0.14.1>@babel/runtime": "catalog:"
  "react-swipeable-views-utils-react-18-fix@0.14.1>@babel/runtime": "catalog:"
  # Keep Babel's transitive SemVer implementation on the maintained catalog line.
  semver: "catalog:"
  # frontmatter-markdown-loader, latest 3.7.0, still asks for markdown-it 12,
  # which has open security alerts. 14 keeps the markdownIt().render() API it uses.
  "frontmatter-markdown-loader>markdown-it": "catalog:"
  # Older Sharp versions pulled by Payload have caused native installation failures.
  sharp: "catalog:"
  # Avoid incompatible duplicate Undici declarations across Node and HTTP packages.
  undici-types: "catalog:"

# Legacy Payload v2 packages rely on undeclared dependencies that local workspace
# hoisting can mask. Extend their manifests here so pnpm's isolated Docker installs
# resolve imports from the packages that use them; app-level dependencies cannot.
packageExtensions:
  "@payloadcms/bundler-webpack@1.0.7":
    dependencies:
      express: ^4.19.2
  # Sentry 9 (the Payload v2 apps) doesn't declare the OpenTelemetry packages
  # that its @sentry/opentelemetry bridge peers on. pnpm then fills them with
  # the workspace's newest (2.x, from Sentry 10), while @sentry/node 9 loads
  # 1.x. Pin them to the 1.x line that @sentry/node 9 uses.
  "@sentry/nextjs@9":
    dependencies:
      "@opentelemetry/core": ^1.30.1
      "@opentelemetry/sdk-trace-base": ^1.30.1
  "@sentry/vercel-edge@9":
    dependencies:
      "@opentelemetry/core": ^1.30.1
      "@opentelemetry/sdk-trace-base": ^1.30.1
  "@payloadcms/plugin-seo@2.4.0":
    dependencies:
      react-i18next: 11.18.6
  "mongoose-aggregate-paginate-v2@1.0.6":
    dependencies:
      mongoose: 6.13.8
  "payload@2.32.3":
    dependencies:
      ajv: 8.14.0

